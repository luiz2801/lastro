# Valores de referência para os testes "golden" (Fase 2).
#
# Cada valor vem de documento publicado pela própria companhia (fonte) e foi conferido em
# 2026-10-30 contra os dados abertos da CVM (DFP/ITR consolidados). Unidade: R$ milhões.
# Períodos: "2025" = exercício; "1T26" = trimestre; "1S26" = acumulado no semestre;
# datas (AAAA-MM-DD) = saldos de balanço.
#
# Definições usadas pelas companhias:
# - ebitda = lucro líquido + tributos + resultado financeiro + D&A = EBIT (DRE 3.05) + D&A
#   (bate com a CVM para Petrobras e Vale; o "ajustado" de cada uma tem outros itens e não está aqui)
# - lucro_controladora = DRE 3.11.01; lucro_total = DRE 3.11

PETR4:
  fonte: "referencias/PETR4/2T26_desempenho_brl.pdf (Tabelas 1 e 10; Endividamento)"
  periodos:
    1S26: {receita_liquida: 293216, lucro_controladora: 85108, lucro_total: 85256, da: 43117, ebitda: 156743}
    2T26: {receita_liquida: 169530, lucro_controladora: 52445, lucro_total: 52495}
    1S25: {receita_liquida: 242272, lucro_controladora: 61861, lucro_total: 62105, da: 39928, ebitda: 113436}
    2T25: {receita_liquida: 119128, lucro_controladora: 26652, lucro_total: 26774}
  saldos:
    2026-06-30:
      divida_financeira_sem_arrendamento: 133734
      arrendamento: 232799
      # "Disponibilidades ajustadas" da Petrobras = 53.931; caixa + aplicações de curto prazo na CVM
      # (BPA 1.01.01 + 1.01.02) = 53.764. A diferença (167) são títulos que a companhia soma ao caixa.
      disponibilidades_ajustadas: 53931
      divida_liquida_companhia: 312602

