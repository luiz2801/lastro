[project]
name = "valuation"
version = "0.1.0"
description = "Valuation de ações da B3 (uso pessoal e educacional; não é recomendação de investimento)"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "pyarrow>=15",
    "pydantic>=2.6",
    "pyyaml>=6",
    "typer>=0.12",
    "rich>=13",
    "requests>=2.31",
    "yfinance>=0.2.40",
    "python-bcb>=0.3",
    "statsmodels>=0.14",
    "scipy>=1.12",
    "matplotlib>=3.8",
]

[project.scripts]
valuation = "valuation.cli:app"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "hypothesis>=6",
    "ruff>=0.6",
    "mypy>=1.10",
    "types-PyYAML",
    "types-requests",
    "pandas-stubs",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/valuation"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM", "RUF"]
ignore = ["N818"]  # exceções usam nomes em português (ErroX), sem sufixo "Error"

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["valuation"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["yfinance.*", "bcb.*", "statsmodels.*", "scipy.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
