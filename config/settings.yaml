# Parâmetros globais.
# ATENÇÃO: todos os números de mercado abaixo são [PLACEHOLDER].
# Revise cada um antes de confiar em qualquer resultado.
versao: 1
data_base: hoje                    # "hoje" ou "AAAA-MM-DD"
historico_anos: 10
moeda_saida: BRL

csv:
  separador: ";"
  decimal: ","
  encoding: "utf-8-sig"

cache_ttl_horas: {cvm: 168, precos: 12, macro: 12}

impostos:
  aliquota_nominal: 0.34           # IRPJ+CSLL, regra geral (financeiras têm outra)

custo_capital:
  metodo: brl_direto               # brl_direto | usd_crp
  rf_brl: {fonte: tesouro_prefixado_longo, override: null}
  erp: 0.05                        # PLACEHOLDER
  crp: 0.0                         # só usado em usd_crp
  rf_usd: 0.04                     # PLACEHOLDER, só usd_crp
  inflacao_usd_lp: 0.02            # PLACEHOLDER, só usd_crp
  beta: {metodo: regressao, janela_semanas: 260, ajuste_blume: true, min_r2_aviso: 0.10}
  # Faixa do Kd histórico (despesas financeiras / dívida bruta média): Rf da moeda + spread.
  kd: {spread_min: 0.0, spread_max: 0.05}  # PLACEHOLDER
  # mercado_atual | setor (Fase 8) | manual (exige divida_sobre_capital = D/(D+E))
  estrutura_alvo: {metodo: mercado_atual, divida_sobre_capital: null}

terminal:
  g_nominal_max: 0.05              # teto do crescimento perpétuo nominal (decidido em 2026-10-30)
  ronic: wacc                      # wacc | roic_historico | valor numérico
  checagem_multiplo_saida: true

dcf:
  convencao_meio_periodo: true
  alerta_tv_sobre_ev: 0.75

# Eixos das tabelas de sensibilidade: centro (valor do cenário base) +- faixa, de passo em passo.
# Margem e crescimento são deltas somados a todos os anos explícitos.
sensibilidade:
  wacc_passo: 0.005
  wacc_faixa: 0.02
  g_passo: 0.0025
  g_faixa: 0.01
  margem_passo: 0.01
  margem_faixa: 0.03
  crescimento_passo: 0.01
  crescimento_faixa: 0.03

# Tolerância para aceitar que duas fontes "concordam" (ver docs/decisoes/0004).
# Preço, câmbio e market cap: diferença relativa. Taxas: diferença absoluta em decimal.
validacao_cruzada:
  preco_rel: 0.02
  cambio_rel: 0.015
  market_cap_rel: 0.10
  selic_abs: 0.003
  ipca_abs: 0.0005
  rf_abs: 0.025                    # NTN-F x (NTN-B + Focus): o spread de inflação é grande

# Perfil do investidor -> parâmetros (seção 8.4 do CLAUDE.md). Todos [PLACEHOLDER].
# O perfil não muda fatos contábeis nem o custo de capital: só o desconto exigido, a ponderação
# dos cenários, o horizonte de projeção explícita e o retorno mínimo (Selic + spread).
perfil:
  conservador:
    margem_seguranca: 0.30
    pesos_cenarios: {pessimista: 0.40, base: 0.50, otimista: 0.10}
    horizonte_anos: 5
    hurdle_spread_selic: 0.03
  moderado:
    margem_seguranca: 0.20
    pesos_cenarios: {pessimista: 0.25, base: 0.50, otimista: 0.25}
    horizonte_anos: 7
    hurdle_spread_selic: 0.05
  arrojado:
    margem_seguranca: 0.10
    pesos_cenarios: {pessimista: 0.15, base: 0.50, otimista: 0.35}
    horizonte_anos: 10
    hurdle_spread_selic: 0.07
